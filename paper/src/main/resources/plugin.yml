name: The_Gate
version: 0.3.0mc26.3
main: thegate.main.TheGateMain
load: POSTWORLD
authors: ['EndMySuffering', 'donner', 'lukas123313']
api-version: '1.20'

# PacketEvents wird zuerst geladen, damit The Gate auf die globale Instanz zugreifen kann
depend:
  - packetevents

loadbefore:
  - Geyser-Spigot

softdepend:
  - Multiverse-Core
  - IridiumSkyblock
  - Essentials

commands:
  Gatetools:
    description: Opens the Gatetools UI.
    usage: /gatetools
    aliases: [gt]
  TheGate:
    description: Functional command to reload the config or display information.
    usage: /thegate [reload|help|syncdb|gatedescription|gatename|create|rotate]
    aliases: [tg]